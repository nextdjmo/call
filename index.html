<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#050a08">
<title>Gọi video cho hai đứa</title>
<link rel="preconnect" href="https://0.peerjs.com">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,600;0,700;1,600&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/peerjs@1.5.4/dist/peerjs.min.js"></script>
<style>
:root{--pink-1:#FF8DA1;--blue-1:#8CC2FF;--yel-1:#F0CB85;--gold:#6FD4A4;--bg:#050a08;--ink:#EDEEF2;--mut:rgba(237,238,242,.62);
--glass:rgba(14,24,19,.55);--line:rgba(255,255,255,.12);--red:#E5484D;--b:42px;--ease:cubic-bezier(.2,.8,.2,1);--t:240ms;
--f-title:"Cormorant Garamond",Georgia,serif;--f-body:"Inter",system-ui,sans-serif}
*{box-sizing:border-box;margin:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%;background:var(--bg);color:var(--ink);font-family:var(--f-body);font-weight:500;overscroll-behavior:none}
body{padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left)}
.hidden{display:none!important}
button{font:inherit;cursor:pointer;color:var(--ink);border:0;background:none;transition:transform var(--t) var(--ease),background var(--t),opacity var(--t)}
button:active{transform:scale(.92)}
button:disabled{opacity:.35;cursor:default}
button:focus-visible,input:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
svg{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;pointer-events:none}
@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-8px)}}
@keyframes pp{from{transform:scale(.92);opacity:0}to{transform:scale(1);opacity:1}}
@keyframes fl{0%{opacity:0;transform:translate(-50%,-30%) scale(.4)}15%{opacity:1;transform:translate(-50%,-50%) scale(1.1)}80%{opacity:1}100%{opacity:0;transform:translate(-50%,-110%) scale(1)}}
#top,#zoomctl,#bar,#react,#status,#tray,#hint,.fxcap,#stk,#msg{background:var(--glass);border:1px solid var(--line);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);box-shadow:0 8px 30px rgba(0,0,0,.35)}
/* Trang chủ */
#home{position:relative;overflow:hidden;min-height:100%;display:flex;flex-direction:column;justify-content:center;align-items:center;padding:28px 20px;gap:14px;text-align:center;background:radial-gradient(60% 45% at 50% 22%,rgba(111,212,164,.16),transparent 70%),var(--bg)}
.mark{width:56px;height:56px;border-radius:50%;border:1px solid rgba(111,212,164,.5);display:grid;place-items:center;color:var(--gold);font-size:22px;box-shadow:0 0 40px rgba(111,212,164,.18)}
#home h1{font-family:var(--f-title);font-weight:600;font-size:clamp(36px,9vw,56px);line-height:1.05}
#home p{max-width:360px;line-height:1.6;font-size:14px;color:var(--mut)}
.box{width:100%;max-width:360px;display:flex;flex-direction:column;gap:12px;padding:20px;border-radius:24px;background:var(--glass);border:1px solid var(--line);backdrop-filter:blur(12px);box-shadow:0 20px 60px rgba(0,0,0,.5)}
#name,#code,#msg{font:inherit;font-size:16px;height:48px;padding:0 18px;border-radius:14px;color:var(--ink);text-align:center;transition:border-color var(--t)}
#name,#code{border:1px solid var(--line);background:rgba(255,255,255,.06)}
#name::placeholder,#code::placeholder,#msg::placeholder{color:var(--mut)}
#name:focus,#code:focus,#msg:focus{outline:none;border-color:var(--gold)}
.main{height:48px;border-radius:14px;color:#07130d;font-weight:600;font-size:16px;background:linear-gradient(135deg,#A6EBC9,#34A876);box-shadow:0 8px 24px rgba(52,168,118,.3)}
.ghost{min-height:40px;font-size:13px;color:var(--mut);text-decoration:underline}
#err{color:var(--pink-1);font-size:13px;min-height:16px}
/* Màn hình gọi */
#call{position:fixed;left:0;right:0;top:0;height:100%;background:radial-gradient(80% 60% at 50% 40%,#0e1a15,var(--bg));overflow:hidden;touch-action:none}
#call::after{content:"";position:absolute;inset:0;z-index:1;pointer-events:none;background:radial-gradient(120% 100% at 50% 50%,transparent 55%,rgba(0,0,0,.55))}
#remote{will-change:transform;position:absolute;left:50%;top:50%;transform:translate(-50%,-50%) translate(var(--px,0px),var(--py,0px)) scale(var(--z,1));touch-action:none;width:240px;height:320px;object-fit:contain;opacity:0;pointer-events:none;transition:opacity .6s ease}
#remote.on{opacity:1;pointer-events:auto}
#remote.pip{left:12px;top:calc(124px + env(safe-area-inset-top));transform:none!important;border-radius:16px;border:1px solid var(--line);background:#000;z-index:2;box-shadow:0 10px 30px rgba(0,0,0,.5)}
#screen{position:absolute;inset:0;width:100%;height:100%;object-fit:contain;background:#000;transform:translate(var(--px,0px),var(--py,0px)) scale(var(--z,1));touch-action:none}
#novideo{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;text-align:center;padding:24px;color:var(--mut);font-size:14px}
#novideo::before{content:"🐰💕🐻";font-size:52px;animation:bob 2.4s ease-in-out infinite}
#novideo b{font-family:var(--f-title);font-size:28px;font-weight:600;color:var(--ink)}
#local{position:absolute;right:12px;top:calc(12px + env(safe-area-inset-top));z-index:3;width:clamp(96px,26vw,168px);aspect-ratio:3/4;object-fit:cover;border-radius:16px;border:1px solid rgba(255,255,255,.2);background:#111;transform:scaleX(-1);box-shadow:0 10px 30px rgba(0,0,0,.55)}
#local.back{transform:none}
#local{touch-action:manipulation}
#call.swap #local{left:0;right:0;top:0;width:100%;height:100%;aspect-ratio:auto!important;border-radius:0;border:0;box-shadow:none;z-index:1;object-fit:cover}
#call.swap #remote{left:auto!important;right:12px;top:calc(12px + env(safe-area-inset-top))!important;transform:none!important;width:clamp(96px,26vw,168px)!important;height:auto!important;aspect-ratio:var(--ra,3/4);object-fit:cover;border-radius:16px;border:1px solid rgba(255,255,255,.2);background:#111;z-index:3;box-shadow:0 10px 30px rgba(0,0,0,.55)}
#call.swap #zoomctl,#call.swap #hint{display:none}
@media(min-width:900px){#local{width:clamp(160px,13vw,240px)}}
#hint{position:absolute;left:50%;transform:translateX(-50%);bottom:calc(92px + env(safe-area-inset-bottom));padding:6px 14px;border-radius:999px;font-size:12px;color:var(--mut);white-space:nowrap;pointer-events:none;z-index:4;animation:pp .35s var(--ease)}
#status{position:absolute;left:50%;top:38%;transform:translateX(-50%);width:min(86%,320px);text-align:center;padding:16px 20px;border-radius:20px;pointer-events:none;transition:opacity .4s;z-index:4}
#status b{display:block;font-family:var(--f-title);font-size:24px;font-weight:600;margin-bottom:2px}
#status span{font-size:13px;color:var(--mut)}
#status.gone{opacity:0}
.ui{transition:opacity .35s ease,transform .35s ease}
.ui.away{opacity:0;pointer-events:none}
#hud{position:absolute;left:12px;top:calc(12px + env(safe-area-inset-top));z-index:4;display:flex;flex-direction:column;gap:8px;align-items:flex-start;max-width:calc(100% - 150px)}
#top{display:flex;align-items:center;gap:8px;height:40px;padding:0 4px 0 14px;border-radius:999px;max-width:100%}
#q{flex:none;width:8px;height:8px;border-radius:50%;background:#777}
#q.good{background:#5ED18A;box-shadow:0 0 8px #5ED18A}#q.mid{background:var(--yel-1)}#q.bad{background:#FF6B81}
#peername{font-size:13px;max-width:30vw;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#copy{display:flex;align-items:center;gap:6px;height:32px;padding:0 12px;border-radius:999px;font-size:12px;background:rgba(255,255,255,.1);white-space:nowrap}
#copy svg{width:14px;height:14px}
#devbtn,#fxbtn{flex:none;width:32px;height:32px;border-radius:50%;display:grid;place-items:center;background:rgba(255,255,255,.1)}
#devbtn svg,#fxbtn svg{width:16px;height:16px}
#dev,#fxp{display:flex;flex-direction:column;gap:10px;width:min(100%,260px);padding:12px;border-radius:18px;font-size:12px;color:var(--mut);background:var(--glass);border:1px solid var(--line);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);box-shadow:0 8px 30px rgba(0,0,0,.35)}
#fxbtn.act{background:var(--gold);color:#07130d}
.frow{display:flex;justify-content:space-between;color:var(--ink);font-size:12px}
#fxp .rng{width:100%;flex:none}
#bgchips,#lkchips{display:flex;gap:6px;flex-wrap:wrap}
#lkamt{width:100%;accent-color:var(--gold)}
#bgchips button,#lkchips button{height:30px;padding:0 12px;border-radius:999px;border:1px solid var(--line);background:rgba(255,255,255,.06);font-size:12px}
#bgchips button.on,#lkchips button.on{background:var(--gold);color:#07130d;border-color:transparent}
.sw{display:flex;align-items:center;justify-content:space-between;gap:12px;color:var(--ink);cursor:pointer}
.sw small{display:block;color:var(--mut);font-size:11px;margin-top:2px}
.sw input{position:absolute;opacity:0;pointer-events:none}
.sw i{flex:none;width:40px;height:24px;border-radius:99px;background:rgba(255,255,255,.18);position:relative;transition:background .2s}
.sw i::after{content:"";position:absolute;left:3px;top:3px;width:18px;height:18px;border-radius:50%;background:#fff;transition:transform .2s var(--ease)}
.sw input:checked+i{background:var(--gold)}
.sw input:checked+i::after{transform:translateX(16px)}
.sw input:focus-visible+i{outline:2px solid var(--gold);outline-offset:2px}
#fxstat{min-height:14px;font-size:11px;color:var(--mut)}
#gesthint{display:flex;flex-direction:column;gap:4px;color:var(--ink);font-size:12px;font-weight:600}
#gesthint span{font-size:16px;letter-spacing:1px;font-weight:400;line-height:1.4}
@media(max-width:479px){#copylbl{display:none}#copy{padding:0;width:32px;justify-content:center}#peername{max-width:22vw;min-width:0}}
#dev label{display:flex;flex-direction:column;gap:4px}
#dev select{font:inherit;font-size:13px;height:36px;padding:0 8px;border-radius:10px;border:1px solid var(--line);background:rgba(255,255,255,.08);color:var(--ink);width:100%}
#dev select option{color:#000}
#zoomctl{display:flex;align-items:center;gap:8px;height:40px;width:min(100%,220px);padding:0 4px 0 12px;border-radius:999px;color:var(--mut)}
.rng{-webkit-appearance:none;appearance:none;flex:1;min-width:0;height:28px;margin:0;padding:0;border:0;background:transparent;cursor:pointer;touch-action:none}
.rng::-webkit-slider-runnable-track{height:3px;border-radius:9px;background:rgba(255,255,255,.22)}
.rng::-moz-range-track{height:3px;border-radius:9px;background:rgba(255,255,255,.22)}
.rng::-webkit-slider-thumb{-webkit-appearance:none;width:16px;height:16px;margin-top:-6.5px;border-radius:50%;background:var(--gold);border:0;box-shadow:0 2px 8px rgba(0,0,0,.5)}
.rng::-moz-range-thumb{width:16px;height:16px;border-radius:50%;background:var(--gold);border:0}
#zlbl{min-width:42px;height:32px;padding:0 8px;border-radius:999px;background:rgba(255,255,255,.1);font-size:12px;font-variant-numeric:tabular-nums}
#bar{position:absolute;left:0;right:0;margin:0 auto;width:max-content;max-width:calc(100% - 16px);bottom:calc(14px + env(safe-area-inset-bottom));z-index:4;display:flex;gap:4px;padding:6px;border-radius:999px}
#bar.away{transform:translateY(12px)}
#bar button{width:var(--b);height:var(--b);border-radius:50%;display:grid;place-items:center;position:relative}
#bar button:hover{background:rgba(255,255,255,.12)}
.sl{opacity:0}
#mic.off .sl,#cam.off .sl{opacity:1}
#mic.off,#cam.off{background:rgba(229,72,77,.9)!important;color:#fff}
#chatbtn.off,#share.off,#reactbtn.act{background:rgba(111,212,164,.92)!important;color:#07130d}
#bar #end{width:calc(var(--b)*1.35);background:var(--red);color:#fff}
#end svg{transform:rotate(135deg)}
#chatbtn.dot::after{content:"";position:absolute;top:8px;right:8px;width:9px;height:9px;border-radius:50%;background:var(--gold);border:2px solid #0e1813}
#react{position:absolute;left:0;right:0;margin:0 auto;width:max-content;max-width:calc(100% - 16px);bottom:calc(76px + env(safe-area-inset-bottom));z-index:4;display:flex;gap:2px;padding:6px;border-radius:999px;opacity:0;pointer-events:none;transform:translateY(8px)}
#react.open{opacity:1;pointer-events:auto;transform:none}
#react.open.away{opacity:0;pointer-events:none}
#react button{width:40px;height:40px;border-radius:50%;font-size:22px;display:grid;place-items:center}
#react button:hover{background:rgba(255,255,255,.12)}
@media(min-width:600px){:root{--b:48px}#bar{gap:6px;padding:8px}#react{bottom:calc(88px + env(safe-area-inset-bottom))}#react button{width:44px;height:44px;font-size:24px}}
/* Nhắn tin */
#chat{position:absolute;left:12px;right:12px;bottom:calc(76px + env(safe-area-inset-bottom));max-height:55%;z-index:4;display:flex;flex-direction:column;gap:8px;justify-content:flex-end;pointer-events:none}
#chatup{min-height:0;display:flex;flex-direction:column;gap:8px;justify-content:flex-end;transition:margin .25s var(--ease)}
#call:has(#react.open) #chatup{margin-bottom:64px}
#call:has(#chat:not(.hidden)) #react{bottom:calc(128px + env(safe-area-inset-bottom))}
#call:has(#tray:not(.hidden)) #react{opacity:0;pointer-events:none}
@media(min-width:600px){#chat{left:auto;width:380px;right:16px;bottom:calc(88px + env(safe-area-inset-bottom))}#call:has(#react.open) #chatup{margin-bottom:70px}#call:has(#chat:not(.hidden)) #react{bottom:calc(142px + env(safe-area-inset-bottom))}}
#msgs{min-height:0;overflow-y:auto;display:flex;flex-direction:column;gap:6px;pointer-events:auto;padding:2px 6px 2px 2px;scrollbar-width:thin;scrollbar-color:rgba(255,255,255,.25) transparent}
.m{max-width:82%;padding:8px 13px;border-radius:16px;font-size:14px;line-height:1.4;word-break:break-word;white-space:pre-wrap;border:1px solid var(--line);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);animation:pp .25s var(--ease)}
.m.me{align-self:flex-end;background:rgba(111,212,164,.18);border-color:rgba(111,212,164,.4);border-bottom-right-radius:4px}
.m.them{align-self:flex-start;background:rgba(14,24,19,.6);border-bottom-left-radius:4px}
.m small{display:block;color:var(--mut);font-size:11px;margin-bottom:2px}
.m.st{background:none!important;border:0;backdrop-filter:none;padding:0;font-size:56px;line-height:1.1}
.m.st img{height:104px;max-width:60vw;object-fit:contain;display:block}
#row{display:flex;gap:8px;pointer-events:auto}
#msg{flex:1;min-width:0;text-align:left;height:44px;border-radius:999px}
#send,#stk{width:44px;height:44px;flex:none;border-radius:50%;display:grid;place-items:center}
#send{background:linear-gradient(135deg,#A6EBC9,#34A876);color:#07130d}
#tray{display:grid;grid-template-columns:repeat(auto-fill,minmax(48px,1fr));gap:6px;max-height:168px;overflow-y:auto;border-radius:18px;padding:8px;pointer-events:auto;scrollbar-width:thin;scrollbar-color:rgba(255,255,255,.25) transparent}
#tray button{background:rgba(255,255,255,.07);border-radius:12px;height:46px;font-size:26px;padding:0;display:flex;align-items:center;justify-content:center;user-select:none;-webkit-user-select:none}
#tray img{max-width:38px;max-height:38px;object-fit:contain;pointer-events:none}
#addst{font-size:22px!important;color:var(--gold)!important;border:1px dashed rgba(111,212,164,.5)!important}
#pop{position:absolute;left:50%;top:38%;font-size:110px;pointer-events:none;z-index:5;animation:fl 2.2s ease-out forwards}
#pop img{height:180px;max-width:70vw;object-fit:contain;display:block}
/* Hiệu ứng cảm xúc */
#fx{position:absolute;inset:0;pointer-events:none;overflow:hidden;z-index:6}
.fxi{position:absolute;left:0;top:0;line-height:1;will-change:transform,opacity;white-space:nowrap}
.fxt{font-family:var(--f-title);font-style:italic;font-weight:600;text-shadow:0 4px 24px rgba(0,0,0,.7)}
.fxcap{position:absolute;left:50%;transform:translateX(-50%);top:calc(130px + env(safe-area-inset-top));padding:7px 16px;border-radius:999px;font-size:13px;white-space:nowrap}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>

<div id="home">
  <div class="mark" aria-hidden="true">♥</div>
  <h1>Gọi video cho hai đứa</h1>
  <p>Nhập một mã phòng bất kỳ, gửi link cho người ấy, hai người vào cùng mã là gặp nhau. Không có camera hay mic vẫn nhắn tin được.</p>
  <div class="box">
    <input id="name" placeholder="Tên của bạn" maxlength="20" autocomplete="nickname">
    <input id="code" placeholder="Mã phòng, ví dụ: tinhyeu" maxlength="30" autocapitalize="off" autocomplete="off">
    <button class="main" id="join">Vào phòng</button>
    <button class="ghost" id="rand">Tạo mã ngẫu nhiên</button>
    <div id="err"></div>
  </div>
</div>

<div id="call" class="hidden">
  <video id="remote" autoplay playsinline></video>
  <video id="srcvid" autoplay playsinline muted style="position:fixed;left:0;top:0;width:2px;height:2px;opacity:0;pointer-events:none"></video>
  <div id="novideo" class="hidden"><b id="nvname">Người ấy chưa có hình</b><span>Hai bạn nhắn tin cho nhau nhé</span></div>
  <div id="hint" class="hidden">Chụm hai ngón hoặc chạm đúp để zoom</div>
  <video id="screen" class="hidden" autoplay playsinline></video>
  <video id="local" autoplay playsinline muted></video>
  <div id="status"><b>Đang kết nối…</b></div>
  <div id="hud" class="ui">
    <div id="top"><span id="q" title="Chất lượng kết nối"></span><span id="peername" class="hidden"></span><button id="fxbtn" title="Hiệu ứng"><svg viewBox="0 0 24 24"><path d="m12 3-1.9 5.8a2 2 0 0 1-1.3 1.3L3 12l5.8 1.9a2 2 0 0 1 1.3 1.3L12 21l1.9-5.8a2 2 0 0 1 1.3-1.3L21 12l-5.8-1.9a2 2 0 0 1-1.3-1.3Z"/></svg></button><button id="devbtn" title="Micro và loa"><svg viewBox="0 0 24 24"><path d="M3 14h3a2 2 0 0 1 2 2v3a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-7a9 9 0 0 1 18 0v7a2 2 0 0 1-2 2h-1a2 2 0 0 1-2-2v-3a2 2 0 0 1 2-2h3"/></svg></button><button id="copy"><svg viewBox="0 0 24 24"><path d="M10 13a5 5 0 0 0 7.5.5l3-3a5 5 0 0 0-7-7l-1.7 1.7"/><path d="M14 11a5 5 0 0 0-7.5-.5l-3 3a5 5 0 0 0 7 7l1.7-1.7"/></svg><span id="copylbl">Sao chép link</span></button></div>
    <div id="zoomctl" class="hidden"><svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.3-4.3"/></svg><input id="zslide" class="rng" type="range" min="1" max="5" step="0.05" value="1" aria-label="Zoom hình người ấy"><button id="zlbl" title="Về 1×">1×</button></div>
    <div id="dev" class="hidden"><label>Micro<select id="micsel"></select></label><label id="spkrow">Loa / tai nghe<select id="spksel"></select></label></div>
    <div id="fxp" class="hidden">
      <label class="sw"><span>Làm đẹp da<small>Chỉ làm mịn vùng da, giữ nét mắt môi tóc</small></span><input id="beauty" type="checkbox"><i></i></label>
      <label class="sw"><span>Làm đẹp khuôn mặt<small>Thon mặt, mắt to, môi và má hồng</small></span><input id="beauty2" type="checkbox"><i></i></label>
      <div id="lkchips"></div>
      <label class="sw" style="gap:10px"><span style="flex:none">Cường độ<small>Độ đậm của bộ lọc</small></span><input id="lkamt" type="range" min="10" max="100" step="5" style="position:static;opacity:1;pointer-events:auto"></label>
      <div class="frow"><span>Nền</span></div>
      <div id="bgchips"><button data-bg="off">Tắt</button><button data-bg="blur">Mờ</button><button data-bg="green">Lục bảo</button><button data-bg="dark">Điện ảnh</button></div>
      <div id="gesthint"><b>Cử chỉ tay tự động</b><span>👍 👎 ✌️ 🤟 ✊ 👌 ❤️ 👋 👏 🙏</span></div>
      <div id="fxstat"></div>
    </div>
  </div>

let MPV, fs, seg, ges, inv, lastTs = 0, cpu = false, face, fIni = false, faceUrl = "";

async function getBuf(url) {
  try {
    const c = await caches.open("vcall-models-v1"), hit = await c.match(url);
    if (hit) return new Uint8Array(await hit.arrayBuffer());
    const r = await fetch(url);
    if (!r.ok) throw new Error("http " + r.status);
    c.put(url, r.clone()).catch(() => {});
    return new Uint8Array(await r.arrayBuffer());
  } catch (e) {
    const r = await fetch(url);
    if (!r.ok) throw new Error("http " + r.status);
    return new Uint8Array(await r.arrayBuffer());
  }
}
async function mk(cls, url, opts) {
  const modelAssetBuffer = await getBuf(url);
  const delegate = cpu ? "CPU" : "GPU";
  const canvas = typeof OffscreenCanvas !== "undefined" ? new OffscreenCanvas(1, 1) : undefined; // tự truyền canvas: Chrome/iOS bị thư viện nhận nhầm là không hỗ trợ

  return [m, delegate];
}

  if (face || fIni || !faceUrl || !fs) return; fIni = true;
  try { const r = await mk("FaceLandmarker", faceUrl, { numFaces: 1 }); face = r[0]; postMessage({ t: "ready", k: "face", d: r[1] }); }
  catch (e) { postMessage({ t: "err", k: "face", gpu: !cpu, m: String(e && e.message || e) }); }
  fIni = false;
}
onmessage = async ({ data: d }) => {
  if (d.t === "face") { faceUrl = d.url; initFace(); return; }
  if (d.t === "init") {
    cpu = !!d.cpu;
    try {
      const code = await (await fetch(d.mp + "/vision_bundle.cjs")).text();
      MPV = {}; new Function("exports", code)(MPV);
      fs = await MPV.FilesetResolver.forVisionTasks(d.mp + "/wasm");
    } catch (e) { postMessage({ t: "err", k: "boot", gpu: !cpu, m: String(e && e.message || e) }); return; }
    try {
      const r = await mk("GestureRecognizer", d.ges, { numHands: 2 });
      ges = r[0]; postMessage({ t: "ready", k: "ges", d: r[1] });
    } catch (e) { postMessage({ t: "err", k: "ges", gpu: !cpu, m: String(e && e.message || e) }); }
    try {
      const r = await mk("ImageSegmenter", d.seg, { outputConfidenceMasks: true, outputCategoryMask: false });
      seg = r[0]; postMessage({ t: "ready", k: "seg", d: r[1] });
    } catch (e) { postMessage({ t: "err", k: "seg", gpu: !cpu, m: String(e && e.message || e) }); }
    initFace();
    return;
  }
  if (d.t !== "frame") return;
  const out = { t: "res", asp: d.asp }, tr = [];
  if (d.seg && seg) {
    try {
      seg.segmentForVideo(d.bmp, tsn(), r => {
        const ms = r.confidenceMasks; if (!ms || !ms.length) return;
        const m = ms[ms.length > 1 ? 1 : 0], f = m.getAsFloat32Array(), w = m.width, h = m.height, n = w * h;
        if (inv === undefined) { // tự nhận biết mask là "người" hay "nền": người thường ở giữa khung
          const c = f[(h >> 1) * w + (w >> 1)], e = (f[w * 2 + 2] + f[w * 3 - 3]) / 2;

        }

      });
    } catch (e) {}
  }
  if (d.hand && ges) {
    try {
      const r = ges.recognizeForVideo(d.bmp, tsn());
      out.hands = r.landmarks.map(h => h.map(p => [p.x, p.y]));
      out.cats = r.gestures.map(g => g[0] ? [g[0].categoryName, g[0].score] : ["", 0]);
    } catch (e) {}
  }
  if (d.face && face) { // chỉ gửi 16 số (mắt, cằm, má, mũi, môi) thay vì 478 điểm
    try {
      const l = face.detectForVideo(d.bmp, tsn()).faceLandmarks[0];
      if (l) { const a = l[468], b = l[473], ch = l[152], cl = l[234], cr = l[454], n = l[1], lt = l[0], lb = l[17], ml = l[61], mr = l[291];
        out.face = [a.x, a.y, b.x, b.y, ch.x, ch.y, cl.x, cl.y, cr.x, cr.y, n.x, n.y, (ml.x + mr.x) / 2, (lt.y + lb.y) / 2, Math.abs(mr.x - ml.x) / 2, Math.abs(lb.y - lt.y) / 2]; }
      else out.face = 0;
    } catch (e) {}
  }
  try { d.bmp.close(); } catch (e) {}
  postMessage(out, tr);
};

    if (pinch < .4 * s && !curled(h, 12, 10) && !curled(h, 16, 14) && !curled(h, 20, 18)) return "ok"; // 👌
    const c = cats[i]; if (c && c[1] > .6 && CAT[c[0]]) return CAT[c[0]];

function becomeHost() {

  p.on("open", () => setStatus("Đang chờ người ấy…", "Bấm biểu tượng liên kết ở góc trên rồi gửi cho người ấy"));

  p.on("connection", c => { armWatchdog(); const old = chatConn; setupChat(c); old?.close(); });

}

  let dropTimer;
  call.on("stream", stream => {
    gotStream = true;

  try {
    call.peerConnection.getSenders().forEach(async s => {
      if (!s.track) return;
      const p = s.getParameters();
      if (!p.encodings || !p.encodings.length) p.encodings = [{}];
      if (s.track.kind === "video") {
        p.encodings[0].maxBitrate = LEVELS[lvl].bitrate;
        p.encodings[0].scaleResolutionDownBy = LEVELS[lvl].scale;
        p.encodings[0].maxFramerate = 30;
        p.degradationPreference = "maintain-framerate";

        p.encodings[0].maxBitrate = 64000;

}

  statsTimer = setInterval(async () => {
    try {
      const stats = await call.peerConnection.getStats();
      let rtt = 0, lost = 0, recv = 0, outLoss = 0;
      stats.forEach(r => {

      const cls = (rtt > 400 || loss > .08) ? "bad" : (rtt > 200 || loss > .03) ? "mid" : "good";

      else if (cls === "good") { badN = 0; if (++goodN >= 5 && lvl > 0) { lvl--; goodN = 0; tuneSenders(call); } }

  img.onload = () => {
    let out = "";
    for (const size of [256, 192, 128]) {
      const c = document.createElement("canvas"); c.width = c.height = size;
      const r = Math.min(size / img.width, size / img.height), w = img.width * r, h = img.height * r;
      c.getContext("2d").drawImage(img, (size - w) / 2, (size - h) / 2, w, h);
      out = c.toDataURL("image/webp", .85);
      if (!out.startsWith("data:image/webp")) out = c.toDataURL("image/png");
      if (out.length < 90000) break;
    }
    URL.revokeObjectURL(url);
    if (out.length >= 150000) { alert("Ảnh quá nặng, hãy chọn ảnh khác nhé."); return; }
    customStickers.unshift(out); customStickers = customStickers.slice(0, 24);
